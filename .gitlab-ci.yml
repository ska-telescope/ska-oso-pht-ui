default:
  image: $SKA_K8S_TOOLS_BUILD_DEPLOY

variables:
# Reinstate to enable cypress cloud run in the pipeline
#  JS_E2E_TEST_COMMAND: test:e2e
  GIT_SUBMODULE_STRATEGY: recursive
  # Most jobs that install the dependencies don't run Cypress, so don't download its binary. The
  # jobs that do run it set this to "" (unset).
  CYPRESS_INSTALL_BINARY: "0"

stages:
  - build
  - test
  - lint
  - deploy
  - publish
  - accessibility
  - scan
  - pages
  - integration
  - staging
  - production

ts-typecheck:
  image: ${JS_BUILD_IMAGE}
  stage: lint
  allow_failure: true
  before_script:
    - make js-install
  script:
    - make typecheck

cypress-typecheck:
  image: ${JS_BUILD_IMAGE}
  stage: lint
  before_script:
    - make js-install
  script:
    - make cypress-typecheck

CHANGELOG:
  stage: lint
  only:
    - merge_requests
  allow_failure: true
  script:
    - if git diff --quiet $CI_MERGE_REQUEST_DIFF_BASE_SHA...HEAD -- CHANGELOG.md; then exit 1; fi

# The info script in the templates is for a generic tango environment. We overwrite it to give more useful PHT information
.info_script: &info_script
    - |-
      echo "Status of pods in $KUBE_NAMESPACE namespace:"
      kubectl get pods -n $KUBE_NAMESPACE -o jsonpath="{range .items[*]}{'Pod: '}{.metadata.name}:{'\n'}{'\t'}{'Image: '}{.spec.containers[*].image}{'\n'}{'\t'}{'Status: '}{.status.phase}{'\n'}{end}{'\n'}"
      echo "Addresses to connect to the deployment of the PHT: "
      echo "  https://k8s.stfc.skao.int/$KUBE_NAMESPACE/pht/"

# Currently, the dev template uses ci-dev-$CI_PROJECT_NAME which means only one branch can be deployed at a time, so we overwrite this
.dev_env: &dev_env
  variables: &dev_env_vars
    KUBE_NAMESPACE: "dev-ska-oso-pht-ui-aaa"
    KUBE_HOST: https://k8s.stfc.skao.int
  environment:
    name: "dev-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG"

.staging_env: &staging_env
  variables: &staging_env_vars
    KUBE_HOST: https://k8s.stfc.skao.int
    KUBE_NAMESPACE: "staging-$CI_PROJECT_NAME"
  rules:
  - if: $CI_COMMIT_TAG
  needs: ["helm-chart-publish", "oci-image-publish"]

.production_env: &production_env
  stage: production
  image: $SKA_K8S_TOOLS_BUILD_DEPLOY
  tags:
    - ska-aws-client
  variables:
    KUBE_NAMESPACE: prod-ska-oso-pht-ui
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

js-test:
  cache:
    policy: pull

# e2e deployments use the template's names: environment test/<branch or tag> and one namespace per
# commit (ci-<project>-<short sha>). These replace the template's rules, so they repeat its
# `exists` list.
.e2e_specs:
  exists: &e2e_specs
    - ${JS_PROJECT_DIR}/tests/cypress/**/*.test.*
    - tests/cypress/**/*.test.*
    - ${JS_PROJECT_DIR}/tests/cypress/**/*.cy.*
    - tests/cypress/**/*.cy.*

.e2e_rules:
  rules: &e2e_rules
    - exists: *e2e_specs

# e2e deployments wait longer for backend responses than users would (20s), as the tests'
# BACKEND_TIMEOUT expects. The Makefile passes it to the chart in k8s-install-chart.
js-e2e-deploy:
  variables:
    REQUEST_TIMEOUT_MS: "60000"
  rules: *e2e_rules

# Installs the dependencies, including the Cypress binary, once for the e2e test jobs, while
# js-e2e-deploy installs the chart, and saves them to the cache. Otherwise each parallel test job
# downloads Cypress itself, as they all start before any of them could save the cache. Same
# runner and cache key and paths as the template's js-e2e-test, so the test jobs restore it.
js-e2e-install:
  image: ${JS_BUILD_IMAGE}
  stage: test
  tags:
    - ${SKA_K8S_RUNNER}
  variables:
    # We explicitly want the Cypress binary here, because it is needed for the e2e tests.
    CYPRESS_INSTALL_BINARY: ""
  script:
    - make js-install
  cache:
    key:
      files:
        - ${JS_PROJECT_DIR}/package-lock.json
        - ${JS_PROJECT_DIR}/yarn.lock
      prefix: $CI_COMMIT_SHORT_SHA
    paths:
      - ${JS_PROJECT_DIR}/node_modules/
      - ${JS_PROJECT_DIR}/cache/Cypress
  rules: *e2e_rules

js-e2e-test:
  # SPLIT: "true" makes cypress-split (cypress.config.mjs) read GitLab's CI_NODE_INDEX/
  # CI_NODE_TOTAL to give each job its share of the specs, balanced by the durations in SPLIT_FILE
  parallel: 3
  variables:
    SPLIT: "true"
    SPLIT_FILE: scripts/cypress-timings.json
  rules: *e2e_rules
  needs:
    - js-e2e-deploy
    - js-e2e-install
  # Restores what js-e2e-install saved. Their own install then finds the Cypress binary already
  # there, and doesn't download it again. Only reads the cache, so the jobs don't upload it again.
  cache:
    policy: pull
  # The template gives js-e2e-test an environment, and GitLab treats any job with an environment
  # as a deployment to it, whatever its script does. With parallel set to > 1 that is multiple
  # deployments at once to the same environment, which GitLab fails with data_integrity_failure.
  # These jobs deploy nothing; they test what js-e2e-deploy installed, finding it through
  # KUBE_NAMESPACE. The only reason these jobs would need the environment would be to set
  # auto_stop_in, to stop the deployment a certain time after the tests have finished.
  # For this suite we handle that in stop-js-e2e-test, which removes it whether or not the tests pass.
  environment: null

# Removes the deployment once all the test jobs have finished, whether or not they passed,
# rather than leaving it to auto_stop_in or someone running this by hand
stop-js-e2e-test:
  needs:
    - js-e2e-test
  when: always
  allow_failure: true
  rules:
    - exists: *e2e_specs
      when: always

info-dev-environment:
  <<: *dev_env
  script:
    - *info_script

info-integration:
  script:
    - *info_script

deploy-dev-environment:
  <<: *dev_env
  needs:
    - oci-image-build

test-dev-environment:
  <<: *dev_env

stop-dev-environment:
  <<: *dev_env

# Smoke suite (tests/cypress/smoke): logs in through the real Indigo, and checks that it accepts
# the deployment's redirect URIs (the app URL and <app URL>auth-callback.html). Runs in addition
# to each environment's own checks, against deployments whose URLs are registered with Indigo -
# not the per-commit e2e namespaces, which aren't.
.smoke_test:
  image: ${JS_BUILD_IMAGE}
  tags:
    - ${SKA_K8S_RUNNER}
  variables:
    CYPRESS_INSTALL_BINARY: ""
  before_script:
    - make js-install
  script:
    - >-
      E2E_SUITE=smoke yarn cypress run --e2e --headless
      --config baseUrl=$KUBE_HOST/$KUBE_NAMESPACE/pht/
      --reporter junit --reporter-options "mochaFile=build/reports/smoke-[hash].xml"
  artifacts:
    when: always
    paths:
      - build/reports/
      - tests/cypress/artefacts/
    reports:
      junit: build/reports/smoke-*.xml

# After test-dev-environment has checked the pods are ready (deploying to dev is manual)
smoke-test-dev-environment:
  extends: .smoke_test
  stage: deploy
  needs:
    - test-dev-environment
  variables: *dev_env_vars

deploy-integration:
  variables:
    KUBE_HOST: https://k8s.stfc.skao.int

deploy-staging:
  <<: *staging_env
  script:
    - make k8s-install-chart-car
    - make k8s-wait

redeploy-staging:
  <<: *staging_env
  script:
    - make k8s-uninstall-chart
    - kubectl -n $KUBE_NAMESPACE delete pods,svc,daemonsets,deployments,replicasets,statefulsets,cronjobs,jobs,ingresses,configmaps --all
    - make k8s-install-chart-car
    - make k8s-wait

info-staging:
  <<: *staging_env

stop-staging:
  <<: *staging_env

smoke-test-staging:
  extends: .smoke_test
  stage: staging
  needs:
    - deploy-staging
  variables: *staging_env_vars
  rules:
    - if: $CI_COMMIT_TAG

deploy-production:
  <<: *production_env
  variables:
    KUBE_NAMESPACE: prod-ska-oso-pht-ui
    K8S_SKIP_NAMESPACE: true
  script:
    - make k8s-install-chart-car
    - make k8s-wait
  environment:
    name: prod-ska-oso-pht-ui
    on_stop: stop-production

info-production:
  <<: *production_env
  script:
    - |-
      echo "Status of pods in $KUBE_NAMESPACE namespace:"
      kubectl get pods -n $KUBE_NAMESPACE -o jsonpath="{range .items[*]}{'Pod: '}{.metadata.name}:{'\n'}{'\t'}{'Image: '}{.spec.containers[*].image}{'\n'}{'\t'}{'Status: '}{.status.phase}{'\n'}{end}{'\n'}"
  environment:
    name: prod-ska-oso-pht-ui

stop-production:
  <<: *production_env
  rules:
    - when: never # disabled as we should never really need to run this
  script:
    - make k8s-uninstall-chart
    - kubectl -n $KUBE_NAMESPACE delete pods,svc,daemonsets,deployments,replicasets,statefulsets,cronjobs,jobs,ingresses,configmaps --all
  environment:
    name: prod-ska-oso-pht-ui
    action: stop

include:
  # Accessibility
  - template: Code-Quality.gitlab-ci.yml
  - template: "Verify/Accessibility.gitlab-ci.yml"
  # TS linting and unit testing
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/js.gitlab-ci.yml'
  # OCI
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/oci-image.gitlab-ci.yml"
  # Docs pages
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/docs.gitlab-ci.yml'
  # .post step finalisers eg: badges
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/finaliser.gitlab-ci.yml"
  # Helm Chart linting and Publish
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/helm-chart.gitlab-ci.yml'
  # Tag Based GitLab Release Management
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/release.gitlab-ci.yml'
  # deploy steps
  # - project: 'ska-telescope/templates-repository'
  #   file: 'gitlab-ci/includes/deploy.gitlab-ci.yml'
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/deploy.dev.gitlab-ci.yml'
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/deploy.integration.gitlab-ci.yml'
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/deploy.staging.gitlab-ci.yml'
  # Finalize badges
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/finaliser.gitlab-ci.yml"
  # SonarQube
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/sonar-scan.gitlab-ci.yml'
