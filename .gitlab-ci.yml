default:
  image: $SKA_K8S_TOOLS_BUILD_DEPLOY

variables:
# Reinstate to enable cypress cloud run in the pipeline
#  JS_E2E_TEST_COMMAND: test:e2e
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - build
  - test
  - lint
  - deploy
  - publish
  - accessibility
  - scan
  - pages
  - integration
  - staging
  - production

ts-typecheck:
  image: ${JS_BUILD_IMAGE}
  stage: lint
  allow_failure: true
  before_script:
    - make js-install
  script:
    - make typecheck

cypress-typecheck:
  image: ${JS_BUILD_IMAGE}
  stage: lint
  before_script:
    - make js-install
  script:
    - make cypress-typecheck

CHANGELOG:
  stage: lint
  only:
    - merge_requests
  allow_failure: true
  script:
    - if git diff --quiet $CI_MERGE_REQUEST_DIFF_BASE_SHA...HEAD -- CHANGELOG.md; then exit 1; fi

# The info script in the templates is for a generic tango environment. We overwrite it to give more useful PHT information
.info_script: &info_script
    - |-
      echo "Status of pods in $KUBE_NAMESPACE namespace:"
      kubectl get pods -n $KUBE_NAMESPACE -o jsonpath="{range .items[*]}{'Pod: '}{.metadata.name}:{'\n'}{'\t'}{'Image: '}{.spec.containers[*].image}{'\n'}{'\t'}{'Status: '}{.status.phase}{'\n'}{end}{'\n'}"
      echo "Addresses to connect to the deployment of the PHT: "
      echo "  https://k8s.stfc.skao.int/$KUBE_NAMESPACE/pht/"

# Currently, the dev template uses ci-dev-$CI_PROJECT_NAME which means only one branch can be deployed at a time, so we overwrite this
.dev_env: &dev_env
  variables:
    KUBE_NAMESPACE: "dev-ska-oso-pht-ui-aaa"
    KUBE_HOST: https://k8s.stfc.skao.int
  environment:
    name: "dev-$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG"

.staging_env: &staging_env
  variables:
    KUBE_HOST: https://k8s.stfc.skao.int
    KUBE_NAMESPACE: "staging-$CI_PROJECT_NAME"
  rules:
  - if: $CI_COMMIT_TAG
  needs: ["helm-chart-publish", "oci-image-publish"]

.production_env: &production_env
  stage: production
  image: $SKA_K8S_TOOLS_BUILD_DEPLOY
  tags:
    - ska-aws-client
  variables:
    KUBE_NAMESPACE: prod-ska-oso-pht-ui
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    
# TEST: namespace + environment unique per pipeline rather than per commit/ref
.e2e_isolation:
  variables: &e2e_vars
    KUBE_NAMESPACE: ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_IID
    # The deployment's app waits this long (ms) for backend responses, rather than the users' 20s
    REQUEST_TIMEOUT_MS: "60000"
  environment: &e2e_env
    name: test/$CI_COMMIT_REF_SLUG-$CI_PIPELINE_IID
    kubernetes:
      namespace: ci-$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_IID

# TEMP: logs the environment name GitLab stored (CI_ENVIRONMENT_NAME) and the namespace, to
# confirm $CI_PIPELINE_IID is expanded in them. In after_script because the template's jobs
# already define before_script.
.e2e_expansion_log: &e2e_expansion_log
  - echo "e2e expansion check - pipeline iid=$CI_PIPELINE_IID ref=$CI_COMMIT_REF_SLUG"
  - echo "e2e expansion check - environment name=$CI_ENVIRONMENT_NAME slug=$CI_ENVIRONMENT_SLUG namespace=$KUBE_NAMESPACE"

js-e2e-deploy:
  variables: *e2e_vars
  environment: *e2e_env
  after_script:
    - *e2e_expansion_log
    - kubectl get namespace "$KUBE_NAMESPACE" --show-labels || echo "namespace lookup failed"

js-e2e-test:
  # SPLIT: "true" makes cypress-split (cypress.config.mjs) read GitLab's CI_NODE_INDEX/
  # CI_NODE_TOTAL to give each job its share of the specs, balanced by the durations in SPLIT_FILE
  parallel: 3
  variables:
    <<: *e2e_vars
    SPLIT: "true"
    SPLIT_FILE: scripts/cypress-timings.json
  environment:
    <<: *e2e_env
    # The template makes this job a deployment with auto_stop_in: 1 minute, so the first job to
    # finish could stop the environment while the others are still running. Accessing it
    # instead leaves stopping to js-e2e-deploy's auto_stop_in.
    action: access
  after_script:
    - *e2e_expansion_log

stop-js-e2e-test:
  variables: *e2e_vars
  environment:
    name: test/$CI_COMMIT_REF_SLUG-$CI_PIPELINE_IID
  after_script:
    - *e2e_expansion_log
    - |
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/environments"
      [ -n "$ENV_CLEANUP_TOKEN" ] || echo "environment cleanup: ENV_CLEANUP_TOKEN is not set for this job"
      command -v jq >/dev/null || echo "environment cleanup: jq is not installed in this image"
      curl -sSf --header "PRIVATE-TOKEN: $ENV_CLEANUP_TOKEN" \
        "$api?states=stopped&search=test/$CI_COMMIT_REF_SLUG-&per_page=100" \
      | jq -r --arg re "^test/${CI_COMMIT_REF_SLUG}-[0-9]+$" '.[] | select(.name | test($re)) | .id' \
      | xargs -r -I{} curl -sSf -X DELETE --header "PRIVATE-TOKEN: $ENV_CLEANUP_TOKEN" "$api/{}" \
      || echo "environment cleanup failed (non-fatal)"

info-dev-environment:
  <<: *dev_env
  script:
    - *info_script

info-integration:
  script:
    - *info_script

deploy-dev-environment:
  <<: *dev_env
  needs:
    - oci-image-build

test-dev-environment:
  <<: *dev_env

stop-dev-environment:
  <<: *dev_env

deploy-integration:
  variables:
    KUBE_HOST: https://k8s.stfc.skao.int

deploy-staging:
  <<: *staging_env
  script:
    - make k8s-install-chart-car
    - make k8s-wait

redeploy-staging:
  <<: *staging_env
  script:
    - make k8s-uninstall-chart
    - kubectl -n $KUBE_NAMESPACE delete pods,svc,daemonsets,deployments,replicasets,statefulsets,cronjobs,jobs,ingresses,configmaps --all
    - make k8s-install-chart-car
    - make k8s-wait

info-staging:
  <<: *staging_env

stop-staging:
  <<: *staging_env

deploy-production:
  <<: *production_env
  variables:
    KUBE_NAMESPACE: prod-ska-oso-pht-ui
    K8S_SKIP_NAMESPACE: true
  script:
    - make k8s-install-chart-car
    - make k8s-wait
  environment:
    name: prod-ska-oso-pht-ui
    on_stop: stop-production

info-production:
  <<: *production_env
  script:
    - |-
      echo "Status of pods in $KUBE_NAMESPACE namespace:"
      kubectl get pods -n $KUBE_NAMESPACE -o jsonpath="{range .items[*]}{'Pod: '}{.metadata.name}:{'\n'}{'\t'}{'Image: '}{.spec.containers[*].image}{'\n'}{'\t'}{'Status: '}{.status.phase}{'\n'}{end}{'\n'}"
  environment:
    name: prod-ska-oso-pht-ui

stop-production:
  <<: *production_env
  rules:
    - when: never # disabled as we should never really need to run this
  script:
    - make k8s-uninstall-chart
    - kubectl -n $KUBE_NAMESPACE delete pods,svc,daemonsets,deployments,replicasets,statefulsets,cronjobs,jobs,ingresses,configmaps --all
  environment:
    name: prod-ska-oso-pht-ui
    action: stop

include:
  # Accessibility
  - template: Code-Quality.gitlab-ci.yml
  - template: "Verify/Accessibility.gitlab-ci.yml"
  # TS linting and unit testing
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/js.gitlab-ci.yml'
  # OCI
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/oci-image.gitlab-ci.yml"
  # Docs pages
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/docs.gitlab-ci.yml'
  # .post step finalisers eg: badges
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/finaliser.gitlab-ci.yml"
  # Helm Chart linting and Publish
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/helm-chart.gitlab-ci.yml'
  # Tag Based GitLab Release Management
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/release.gitlab-ci.yml'
  # deploy steps
  # - project: 'ska-telescope/templates-repository'
  #   file: 'gitlab-ci/includes/deploy.gitlab-ci.yml'
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/deploy.dev.gitlab-ci.yml'
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/deploy.integration.gitlab-ci.yml'
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/deploy.staging.gitlab-ci.yml'
  # Finalize badges
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/finaliser.gitlab-ci.yml"
  # SonarQube
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/sonar-scan.gitlab-ci.yml'
